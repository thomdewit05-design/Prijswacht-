# Xcode-project voor Prijswacht. Maak het project met: xcodegen generate
name: Prijswacht
options:
  bundleIdPrefix: nl.prijswacht
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true
settings:
  base:
    # De code is voor Swift 6 geschreven maar nog niet op een Mac gebouwd.
    # Zet SWIFT_VERSION op 6.0 zodra de waarschuwingen van de strikte
    # concurrency-controle zijn weggewerkt.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  PrijswachtCore:
    path: PrijswachtCore
targets:
  Prijswacht:
    type: application
    platform: iOS
    sources:
      - Prijswacht
      - Shared
    dependencies:
      - package: PrijswachtCore
      - target: PrijswachtShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.prijswacht.app
    info:
      path: Prijswacht/Info.plist
      properties:
        CFBundleDisplayName: Prijswacht
        CFBundleLocalizations: [nl, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Prijswacht/Prijswacht.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.prijswacht.app
  PrijswachtShare:
    type: app-extension
    platform: iOS
    sources:
      - PrijswachtShare
      - Shared
    dependencies:
      - package: PrijswachtCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.prijswacht.app.share
    info:
      path: PrijswachtShare/Info.plist
      properties:
        CFBundleDisplayName: Prijswacht
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: PrijswachtShare/PrijswachtShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.prijswacht.app
